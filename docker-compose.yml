services:
  ec-app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    command: npm run dev
    environment:
      -  MONGODB_URI=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/ecommerce?authSource=admin
    depends_on:
      - mongo
  mongo:
    image: mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
  redis:
    image: redis:alpine
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: es-node
    environment:
      - discovery.type=single-node
    ports:
      - "9200:9200"
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: kibana-node
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://es:9200
    depends_on:
      - es
volumes:
  mongo_data: